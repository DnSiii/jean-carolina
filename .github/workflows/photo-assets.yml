name: Montar fotos tratadas
on:
  push:
    branches: [photo-refresh]
    paths:
      - '.imagechunks/trigger'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: photo-refresh
      - name: Reconstruir imagens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          for img in gallery1 gallery2 gallery3; do
            cat .imagechunks/${img}.*.part | base64 --decode > assets/${img}.webp
          done
          rm -rf .imagechunks
          rm -f .github/workflows/photo-assets.yml
      - name: Salvar imagens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add enhanced wedding photos"
          git push origin photo-refresh
