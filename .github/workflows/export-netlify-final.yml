name: Exportar pacote final Netlify
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-netlify-final.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir estrutura
        run: |
          test -f index.html
          test -f noivos/index.html
          test -d assets
      - name: Gerar pacote para Netlify
        uses: actions/upload-artifact@v4
        with:
          name: jean-carolina-netlify-final
          path: |
            index.html
            assets
            noivos
          retention-days: 1
