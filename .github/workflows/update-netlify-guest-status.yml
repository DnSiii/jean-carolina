name: Atualizar ZIP com status convidado
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-netlify-guest-status.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Gerar ZIP atualizado
        run: |
          set -euo pipefail
          mkdir -p downloads
          test -f noivos/index.html
          grep -q 'Status convidado' noivos/index.html
          grep -q 'guest_reported_paid' noivos/index.html
          rm -f downloads/Jean-Carolina-Netlify-FINAL-CAPA-ORIGINAL.zip
          zip -r downloads/Jean-Carolina-Netlify-FINAL-CAPA-ORIGINAL.zip index.html assets noivos
          rm -f .github/workflows/update-netlify-guest-status.yml
      - name: Publicar pacote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Netlify ZIP with guest Pix status"
          git push
