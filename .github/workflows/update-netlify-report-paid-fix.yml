name: Atualizar ZIP com correção do botão Pix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-netlify-report-paid-fix.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validar correção
        run: |
          set -euo pipefail
          grep -q "document.getElementById('reportPaid').onclick" index.html
          grep -q "Obrigado! Seu presente foi registrado com sucesso" index.html
          mkdir -p downloads
          rm -f downloads/Jean-Carolina-Netlify-FINAL-CAPA-ORIGINAL.zip
          zip -r downloads/Jean-Carolina-Netlify-FINAL-CAPA-ORIGINAL.zip index.html assets noivos
          rm -f .github/workflows/update-netlify-report-paid-fix.yml
      - name: Publicar pacote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Netlify ZIP with working report paid button"
          git push
