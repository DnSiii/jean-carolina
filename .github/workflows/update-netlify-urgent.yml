name: Atualizar ZIP urgente Netlify
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-netlify-urgent.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Gerar pacote limpo
        run: |
          set -euo pipefail
          mkdir -p downloads
          grep -q '"hero":"assets/hero-original.jpg"' index.html
          ! grep -qi 'Pix pendente' index.html
          ! grep -qi 'noivos conferem' index.html
          ! grep -qi 'Pix realizado' index.html
          rm -f downloads/Jean-Carolina-Netlify-FINAL-CAPA-ORIGINAL.zip
          zip -r downloads/Jean-Carolina-Netlify-FINAL-CAPA-ORIGINAL.zip index.html assets noivos
          rm -f .github/workflows/update-netlify-urgent.yml
      - name: Publicar pacote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update final Netlify ZIP without internal Pix details"
          git push
