name: Publicar foto original da capa
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-original-hero.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar foto original
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          base64 --decode .imagepayload/hero-original.b64 > assets/hero-original.jpg
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='"hero":"assets/hero-hq.webp"'
          new='"hero":"assets/hero-original.jpg"'
          if old not in s and new not in s:
              raise SystemExit('Referencia da capa nao encontrada')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          test "$(sha256sum assets/hero-original.jpg | cut -d' ' -f1)" = "611bf1400eb2f05641bf06e9a0d662abadcc7c34a1027c2360947565fb8ad9d5"
          rm -rf .imagepayload
          rm -f .github/workflows/publish-original-hero.yml
      - name: Publicar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use original photo for wedding hero"
          git push
