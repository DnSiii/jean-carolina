name: Exportar site para Netlify
on:
  push:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar pacote
        run: zip -r jean-carolina-netlify.zip index.html assets noivos
      - name: Salvar pacote
        uses: actions/upload-artifact@v4
        with:
          name: jean-carolina-netlify
          path: jean-carolina-netlify.zip
          retention-days: 1
