name: Atualizar ZIP com Della Torre
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-netlify-della-torre.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validar e gerar ZIP
        run: |
          set -euo pipefail
          grep -q 'Espaço Della Torre' index.html
          grep -q 'Sítio Dois Lagos' index.html
          mkdir -p downloads
          rm -f downloads/Jean-Carolina-Netlify-FINAL-CAPA-ORIGINAL.zip
          zip -r downloads/Jean-Carolina-Netlify-FINAL-CAPA-ORIGINAL.zip index.html assets noivos
          rm -f .github/workflows/update-netlify-della-torre.yml
      - name: Publicar pacote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Netlify ZIP with Della Torre directions"
          git push
