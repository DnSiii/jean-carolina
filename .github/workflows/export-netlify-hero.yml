name: Exportar Netlify atualizado
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-netlify-hero.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir estrutura
        run: |
          test -f index.html
          test -f noivos/index.html
          test -d assets
      - name: Empacotar site
        run: zip -r jean-carolina-atual.zip index.html assets noivos
      - name: Salvar pacote
        uses: actions/upload-artifact@v4
        with:
          name: jean-carolina-atual
          path: jean-carolina-atual.zip
          retention-days: 1
