name: Improve gift images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-gift-images.yml'

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Improve product images
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageEnhance, ImageFilter
          from pathlib import Path

          names = ['filter','steamer','pan','kettle','rack','sofa']
          for name in names:
              src = Path('assets') / f'{name}.webp'
              dst = Path('assets') / f'{name}-hq.webp'
              im = Image.open(src).convert('RGB')
              im = ImageEnhance.Contrast(im).enhance(1.04)
              im = ImageEnhance.Color(im).enhance(1.02)
              im = im.filter(ImageFilter.UnsharpMask(radius=1.0, percent=120, threshold=2))
              fitted = ImageOps.contain(im, (840,840), method=Image.Resampling.LANCZOS)
              canvas = Image.new('RGB', (900,900), '#ffffff')
              x=(900-fitted.width)//2
              y=(900-fitted.height)//2
              canvas.paste(fitted,(x,y))
              canvas = canvas.filter(ImageFilter.UnsharpMask(radius=0.8, percent=105, threshold=2))
              canvas.save(dst,'WEBP',quality=92,method=6)
          PY
      - name: Commit improved assets
        run: |
          rm -f .github/workflows/improve-gift-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve gift product image quality"
          git push origin main
