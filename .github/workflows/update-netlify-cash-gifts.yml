name: Atualizar ZIP com cartões presente
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-netlify-cash-gifts.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validar painel
        run: |
          set -euo pipefail
          grep -q "Cartão Presente R\$ 100" noivos/index.html
          grep -q "Valor arrecadado" noivos/index.html
          mkdir -p downloads
          rm -f downloads/Jean-Carolina-Netlify-FINAL-CAPA-ORIGINAL.zip
          zip -r downloads/Jean-Carolina-Netlify-FINAL-CAPA-ORIGINAL.zip index.html assets noivos
          rm -f .github/workflows/update-netlify-cash-gifts.yml
      - name: Publicar pacote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Netlify ZIP with gift card totals"
          git push
