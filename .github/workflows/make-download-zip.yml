name: Gerar ZIP para download direto
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/make-download-zip.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Criar ZIP final
        run: |
          mkdir -p downloads
          zip -r downloads/jean-carolina-netlify.zip index.html assets noivos
          rm -f .github/workflows/make-download-zip.yml
      - name: Publicar ZIP no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add final Netlify download package"
          git push
